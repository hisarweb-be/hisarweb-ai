<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>HisarWeb AI</title>
    <meta name="title" content="HisarWeb AI" />
    <meta
      name="description"
      content="Claude ve Gemini modellerine uygun fiyatlı API erişimi; TL ile ödeyin."
    />
    <!-- Share preview (WhatsApp, LinkedIn, X): absolute image URL, 1200x630 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HisarWeb AI" />
    <meta property="og:title" content="HisarWeb AI" />
    <meta
      property="og:description"
      content="Claude ve Gemini modellerine uygun fiyatlı API erişimi; TL ile ödeyin."
    />
    <meta property="og:url" content="https://api.hisarweb.be/" />
    <meta property="og:image" content="https://api.hisarweb.be/og-hisarweb-ai.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HisarWeb AI: Claude ve Gemini API'si, TL ile" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://api.hisarweb.be/og-hisarweb-ai.jpg" />
    <!-- Based on New API (AGPL-3.0), https://github.com/hisarweb-be/hisarweb-ai -->

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>

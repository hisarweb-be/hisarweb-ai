# Production compose for the HisarWeb AI gateway (fork of new-api).
#
# Every secret is read from the environment of the deployment platform; this
# file only carries names. Coolify reads this file as a Docker Compose
# application and fills the ${...} references from the app's environment
# variables. See deploy/README-uitrol.md for the list and the rollout steps.
name: hisarweb-ai

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hisarweb-ai:prod
    restart: unless-stopped
    # One customer-facing gateway process: 512 MB and one CPU is the agreed
    # ceiling (proposal in the H2 assignment).
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Fixed, never interpolated: this compose is the customer-facing
      # deployment, and APP_ENV decides whether the production guards are on
      # (setup token, secure cookies, no default administrator password).
      APP_ENV: "production"
      PORT: "3000"
      TZ: ${TZ:-Europe/Istanbul}
      SQL_DSN: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      # One-time secret of POST /api/setup; production refuses setup without it.
      HW_SETUP_TOKEN: ${HW_SETUP_TOKEN:?HW_SETUP_TOKEN is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?CRYPTO_SECRET is required}
      HW_SIGNAL_SALT: ${HW_SIGNAL_SALT:?HW_SIGNAL_SALT is required}
      # Single node: the in-process cache replaces Redis (no redis service here).
      MEMORY_CACHE_ENABLED: "true"
      # Behind the Coolify proxy over HTTPS, so the refresh cookie is Secure and
      # the exact HTTPS origin(s) must be named.
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:?SESSION_COOKIE_TRUSTED_URL is required}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-tr}
      ERROR_LOG_ENABLED: "true"
      # Fixed off, never interpolated: with batch updates on, consumption waits
      # in memory while the credit package expiry run reads users.quota, so the
      # same consumption is deducted twice. Traffic is low enough for direct
      # quota writes.
      BATCH_UPDATE_ENABLED: "false"
      NODE_NAME: ${NODE_NAME:-hisarweb-ai-1}
      # Card payments (Revolut Merchant). Empty means the payment route refuses
      # to start a payment instead of failing at the provider.
      REVOLUT_SECRET_KEY: ${REVOLUT_SECRET_KEY:-}
      REVOLUT_WEBHOOK_SECRET: ${REVOLUT_WEBHOOK_SECRET:-}
      REVOLUT_API_BASE: ${REVOLUT_API_BASE:-}
      REVOLUT_API_VERSION: ${REVOLUT_API_VERSION:-}
      # Card payments (Stripe Checkout, TRY). Chosen over Revolut when both
      # values are set.
      HW_STRIPE_SECRET_KEY: ${HW_STRIPE_SECRET_KEY:-}
      HW_STRIPE_WEBHOOK_SECRET: ${HW_STRIPE_WEBHOOK_SECRET:-}
      # Bureau reserve gate.
      HW_BUREAU_USAGE_URL: ${HW_BUREAU_USAGE_URL:-}
      HW_BUREAU_USAGE_TOKEN: ${HW_BUREAU_USAGE_TOKEN:-}
      HW_WINDOW_CAPACITY_USD: ${HW_WINDOW_CAPACITY_USD:-}
      HW_RESERVE_MODE: ${HW_RESERVE_MODE:-}
      # Optional widening of one Content-Security-Policy directive each: a
      # comma-separated list of bare https origins. Empty keeps the tight
      # default (no external frame, image, style or font host).
      HW_CSP_EXTRA_FRAME_SRC: ${HW_CSP_EXTRA_FRAME_SRC:-}
      HW_CSP_EXTRA_CONNECT_SRC: ${HW_CSP_EXTRA_CONNECT_SRC:-}
      HW_CSP_EXTRA_IMG_SRC: ${HW_CSP_EXTRA_IMG_SRC:-}
      HW_CSP_EXTRA_STYLE_SRC: ${HW_CSP_EXTRA_STYLE_SRC:-}
      HW_CSP_EXTRA_FONT_SRC: ${HW_CSP_EXTRA_FONT_SRC:-}
      # Quality measurement (admin action POST /api/hw/quality/run). Without all
      # four values the run refuses to start; a half-configured meter must not
      # publish scores. The base URL is the gateway's own customer route and the
      # key is a normal customer API key, so the meter measures what a customer
      # gets. The output directory lies on the data volume, which is the only
      # writable path the container keeps across a restart.
      HW_QUALITY_BASE_URL: ${HW_QUALITY_BASE_URL:-}
      HW_QUALITY_API_KEY: ${HW_QUALITY_API_KEY:-}
      HW_QUALITY_JUDGE_MODEL: ${HW_QUALITY_JUDGE_MODEL:-}
      HW_QUALITY_OUT_DIR: ${HW_QUALITY_OUT_DIR:-}
    ports:
      # Loopback only: the proxy of the platform reaches the container over the
      # compose network, so the gateway never listens on the public interface
      # of the host.
      - "127.0.0.1:${APP_HTTP_PORT:-3000}:3000"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
      # Measured 30 Oct 2026 (deploy of PR #199): the gateway needs about 3.9 s
      # after container start (3.4 s of that is the database migration) before
      # it answers, but without start_interval Docker runs the first probes
      # during start_period only every 5 s. The proxy sends no traffic to a
      # container that is not healthy yet, so every second between "answers"
      # and "first successful probe" is time visitors get "no available
      # server". With 250ms the healthy status follows within 0.25 s.
      start_interval: 250ms

  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    mem_limit: 512m
    # No ports: the database is reachable only inside this compose network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
      # Measured 28 Oct 2026 (HIS-5658): postgres accepts connections 0.1 s
      # after start, but Docker runs the first probe only after
      # start_interval, which defaults to 5 s during start_period regardless
      # of interval or start_period. That default was the whole 5.5 s wait
      # before the app container could start (503 window 7.5 s).
      start_interval: 250ms

volumes:
  app_data:
  pg_data:
